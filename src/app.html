<!doctype html>
<html lang="%lang%">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta
            name="text-scale"
            content="scale" />
        <meta
            name="theme-color"
            content="#1b1d3a" />
        <meta
            name="mobile-web-app-capable"
            content="yes" />
        <meta
            name="apple-mobile-web-app-capable"
            content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent" />
        <link
            rel="manifest"
            href="%sveltekit.assets%/manifest.webmanifest" />
        <link
            rel="apple-touch-icon"
            href="%sveltekit.assets%/icons/icon-192.png" />
        <link
            rel="preconnect"
            href="https://fonts.googleapis.com" />
        <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..900,0..100,0..1&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" />
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
