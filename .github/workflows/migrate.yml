name: Migrate database

# Schema changes reach production from here, on main, so code and schema land together.
# Never from Vercel's build (a preview build would migrate production) and not by hand.
# Decided in issue #24.

on:
    push:
        branches: [main]
        paths:
            - supabase/migrations/**
            # A change to this workflow runs it too, so it is never first tried on a real migration.
            - .github/workflows/migrate.yml
    workflow_dispatch:

concurrency:
    group: migrate-production
    cancel-in-progress: false

jobs:
    push:
        runs-on: ubuntu-latest
        env:
            SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
            SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        steps:
            - uses: actions/checkout@v7
            # The Supabase CLI's release binary, pinned. Not supabase/setup-cli: v1 runs on Node 20,
            # and v3 installs through npm, which refuses this pnpm project (devEngines).
            - name: Install the Supabase CLI 2.109.1
              run: |
                  # Both binaries, side by side: `supabase` is a shim that runs `supabase-go` next to it.
                  mkdir -p "$HOME/.supabase-cli"
                  curl -fsSL "https://github.com/supabase/cli/releases/download/v2.109.1/supabase_linux_amd64.tar.gz" \
                      | tar -xz -C "$HOME/.supabase-cli"
                  echo "$HOME/.supabase-cli" >> "$GITHUB_PATH"
                  "$HOME/.supabase-cli/supabase" --version
            - run: supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
            - run: supabase db push
