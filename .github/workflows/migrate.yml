name: Migrate database

# Schema changes reach production from here, on main, so code and schema land together.
# Never from Vercel's build (a preview build would migrate production) and not by hand.
# Decided in issue #24.

on:
    push:
        branches: [main]
        paths:
            - supabase/migrations/**
    workflow_dispatch:

concurrency:
    group: migrate-production
    cancel-in-progress: false

jobs:
    push:
        runs-on: ubuntu-latest
        env:
            SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
            SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        steps:
            - uses: actions/checkout@v5
            - uses: supabase/setup-cli@v3
              with:
                  version: 2.109.1
            - run: supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
            - run: supabase db push
