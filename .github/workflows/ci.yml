name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pin an exact release: Vite+ asks us not to use the moving v1 tag.
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          cache: true
      - run: vp check
      - run: vp run check:svelte
      - run: vp build
      - run: vp run build-storybook
