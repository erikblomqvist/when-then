name: Keep Supabase awake

# Supabase pauses Free projects after a week without activity. Run a real SQL query every
# three days through the Management API (a plain HTTP ping does not count). GitHub turns
# scheduled workflows off after 60 days without commits; re-enable it under Actions if so.
# Decided in issue #13.

on:
    schedule:
        - cron: '17 6 */3 * *'
    workflow_dispatch:

jobs:
    query:
        runs-on: ubuntu-latest
        steps:
            - name: Run a query against production
              env:
                  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
                  SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
              run: |
                  curl --fail --silent --show-error \
                    --request POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
                    --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
                    --header "Content-Type: application/json" \
                    --data '{"query":"select count(*) as user_roles from public.user_roles"}'
