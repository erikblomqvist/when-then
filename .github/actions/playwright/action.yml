name: Install Playwright's Chromium
description: Headless Chromium for Vitest browser mode and e2e, cached per Playwright version.

runs:
    using: composite
    steps:
        - id: version
          shell: bash
          run: echo "playwright=$(vp exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        # Both test runners launch Chromium headless, which only needs the smaller headless shell.
        - id: cache
          uses: actions/cache@v4
          with:
              path: ~/.cache/ms-playwright
              key: playwright-${{ runner.os }}-${{ steps.version.outputs.playwright }}-chromium-shell
        - if: steps.cache.outputs.cache-hit != 'true'
          shell: bash
          run: vp exec playwright install --with-deps --only-shell chromium
        # The cache holds the browser, not the system libraries it needs.
        - if: steps.cache.outputs.cache-hit == 'true'
          shell: bash
          run: vp exec playwright install-deps chromium
